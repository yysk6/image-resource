spring:
  application:
    name: material-studio
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/material_studio?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${SPRING_DATASOURCE_USERNAME:material_app}
    password: ${SPRING_DATASOURCE_PASSWORD:local_demo_password}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
server:
  port: 8080
app:
  storage-path: ${APP_STORAGE_PATH:./data}
  simulation:
    material-delay-ms: ${SIMULATION_MATERIAL_DELAY_MS:1500}
    generate-delay-ms: ${SIMULATION_GENERATE_DELAY_MS:5000}
    finalize-delay-ms: ${SIMULATION_FINALIZE_DELAY_MS:1500}
    fail-stage: ${SIMULATION_FAIL_STAGE:none}
  executor:
    threads: ${TASK_EXECUTOR_THREADS:2}
    queue-capacity: ${TASK_EXECUTOR_QUEUE_CAPACITY:20}
